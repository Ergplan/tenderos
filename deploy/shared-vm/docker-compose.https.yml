# HTTPS for the shared VM's router, on top of docker-compose.shared.yml: the chooser and both
# apps at https://${SITE_ADDRESS} (Caddy gets and renews the certificate), port 8081 as before.
# Ports 80 and 443 must be free; on the tariff-order VM they were ekbill's Caddy.
#   COMPOSE_FILE=docker-compose.yml:deploy/shared-vm/docker-compose.shared.yml:deploy/shared-vm/docker-compose.https.yml
#   SITE_ADDRESS=34-131-67-235.sslip.io   (or your own domain, its DNS A record on the VM's IP)
services:
  router:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. 34-131-67-235.sslip.io}
    volumes:
      - ./deploy/shared-vm/Caddyfile.https:/etc/caddy/Caddyfile:ro
      - router_data:/data
      - router_config:/config

volumes:
  router_data:
  router_config:
